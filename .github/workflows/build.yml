name: Build SpriteExtractor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build with CMake (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - uses: actions/upload-artifact@v6
        with:
          name: sprite-extractor-artifacts
          path: build/*.exe
          retention-days: 30
